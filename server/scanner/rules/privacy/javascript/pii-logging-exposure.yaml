rules:
- id: javascript-pii-logging-exposure
  languages: [javascript, typescript]
  severity: ERROR
  message: >-
    A value that looks like personal data (based on its name) is passed
    directly to a logging/console call. Logs are frequently retained, shipped
    to third parties, or accessed with broader permissions than the data
    warrants — avoid writing PII to logs, or mask/redact it first.
  metadata:
    cwe:
    - 'CWE-532: Insertion of Sensitive Information into Log File'
    category: security
    subcategory: [privacy]
    technology: [privacy]
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
  patterns:
    - pattern-either:
        - pattern: console.$METHOD($ARG)
        - pattern: console.$METHOD($MSG, $ARG)
        - pattern: $LOGGER.$METHOD($ARG)
        - pattern: $LOGGER.$METHOD($MSG, $ARG)
    - metavariable-regex:
        metavariable: $ARG
        # metavariable-regex anchors like re.match (start of string), so wrap in
        # .* to match the PII-ish vocabulary anywhere in the captured expression
        # text (e.g. "customerSsn", "user.email", "req.body.creditCard").
        regex: (?is).*(ssn|social_security|socialsecurity|email|credit_?card|cardnumber|card_number|cvv|passport|national_?id|driver_?licen[cs]e|date_?of_?birth|\bdob\b|phone_?number|home_?address|street_?address|mailing_?address|bank_?account|routing_?number|iban|tax_?id|medical_?record|health_?record|patient_?id).*
